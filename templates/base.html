<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OP_RETURN Bot{% endblock %}</title>
  {% block refresh %}{% endblock %}
  <link rel="stylesheet" media="screen" href="/assets/stylesheets/main.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous">
  <link rel="shortcut icon" type="image/ico" href="/assets/images/favicon.ico">
  <link rel="stylesheet" href="/assets/stylesheets/dark.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <script src="https://kit.fontawesome.com/6c99a521b7.js" crossorigin="anonymous"></script>
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@benthecarman">
  <meta name="twitter:creator" content="@benthecarman">
  <meta name="twitter:image" content="https://opreturnbot.com/assets/images/op-return-bot.png">
  <meta property="og:url" content="https://opreturnbot.com">
  <meta property="og:title" content="OP_RETURN Bot">
  <meta property="og:description" content="OP_RETURN Bot will create an OP_RETURN output for you, you just need to pay the fees.">
  <meta property="og:image" content="https://opreturnbot.com/assets/images/op-return-bot.png">
  <meta http-equiv="onion-location" content="{{ onion_url }}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-dark">
    <a class="navbar-brand pointer" href="/" style="padding:4px;margin:0">
      <img src="/assets/images/op-return-bot.png" style="height:50px;width:50px" title="logo" alt="OP_RETURN Bot">
      <label class="nav-item" style="color:white;cursor:pointer">OP_RETURN Bot</label>
    </a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav mr-auto"></ul>
      <div class="my-2 my-lg-0"><a class="nav-link" href="{{ onion_url }}"><img src="/assets/images/tor-icon.png" width="50" alt="Tor"></a></div>
      <div class="my-2 my-lg-0"><a class="nav-link" href="/connect"><i class="fa fa-link"></i>&nbsp;Connect</a></div>
    </div>
  </nav>
  <div class="container">{% block content %}{% endblock %}</div>
  <script src="/assets/javascripts/webmcp.js"></script>
</body>
</html>
